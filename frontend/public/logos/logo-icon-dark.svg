<svg width="120" height="130" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond cercle bleu nuit dégradé -->
    <radialGradient id="glowBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </radialGradient>
    <!-- Dégradé pin bleu → cyan lumineux sur fond sombre -->
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <!-- Dégradé anneaux -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="50%"  stop-color="#2DD4BF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Lueur derrière le pin -->
    <radialGradient id="pinGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- Filtre lueur douce -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo de fond diffus derrière tout -->
  <ellipse cx="60" cy="55" rx="48" ry="52" fill="url(#pinGlow)"/>

  <!-- Anneaux (sous le pin) -->
  <ellipse cx="60" cy="102" rx="15" ry="4.5"
    fill="none" stroke="url(#ringGrad)" stroke-width="2.2" opacity="0.9"/>
  <ellipse cx="60" cy="107" rx="26" ry="8"
    fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.55"/>

  <!-- Corps du pin avec lueur -->
  <path d="M60,15 C43,15 30,28 30,45 C30,62 60,98 60,98 C60,98 90,62 90,45 C90,28 77,15 60,15 Z"
    fill="url(#pinGrad)" filter="url(#glow)"/>

  <!-- Cercle intérieur sombre (fond de la croix) -->
  <circle cx="60" cy="45" r="18" fill="#0A1628" opacity="0.55"/>

  <!-- Croix médicale — couleur bleu clair lumineux -->
  <rect x="48" y="41.5" width="24" height="7" rx="2" fill="#E0F2FE"/>
  <rect x="56.5" y="33" width="7" height="24" rx="2" fill="#E0F2FE"/>

  <!-- Petit point brillant en haut du pin (reflet) -->
  <circle cx="50" cy="28" r="3.5" fill="white" opacity="0.25"/>
</svg>
